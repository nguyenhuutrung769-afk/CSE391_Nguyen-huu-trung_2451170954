<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <h1>Weather App</h1>
        <input id="cityInput" type="text" placeholder="Nhập tên thành phố...">
        <button id="searchBtn">Tìm</button>
        <div id="state"></div>
        <div id="weather"></div>
        <h3>Lịch sử tìm kiếm</h3>
        <ul id="history"></ul>
    </div>
    <script src="app.js"></script>
</body>

</html>
