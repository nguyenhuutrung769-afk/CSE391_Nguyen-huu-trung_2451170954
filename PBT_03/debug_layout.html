<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Debug Layout</title>
    <link rel="stylesheet" href="debug_layout.css">
</head>

<body>
    <h2>Layout sửa bằng border-box</h2>
    <div class="container borderbox">
        <div class="sidebar">Sidebar</div>
        <div class="content">Content</div>
    </div>

    <h2>Layout sửa bằng content-box (giảm width)</h2>
    <div class="container contentbox">
        <div class="sidebar">Sidebar</div>
        <div class="content">Content</div>
    </div>
</body>

</html>
