<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Giới thiệu sản phẩm</title>
</head>
<body>
    <h1>Media</h1>

    <section>
        <h2>Sản phẩm</h2>
        <figure>
            <img src="images/product1.jpg" alt="iPhone 16 Pro Max màu Titan" loading="lazy" style="max-width:100%;height:auto;">
            <figcaption>iPhone 16 Pro Max</figcaption>
        </figure>

        <figure>
            <img src="images/product2.jpg" alt="Laptop MacBook Pro 14 inch màu bạc" loading="lazy" style="max-width:100%;height:auto;">
            <figcaption>Laptop MacBook Pro 14 inch</figcaption>
        </figure>

        <figure>
            <img src="images/product3.jpg" alt="Tai nghe AirPods Pro 2 " loading="lazy" style="max-width:100%;height:auto;">
            <figcaption>Tai nghe AirPods Pro 2</figcaption>
        </figure>
    </section>

    <section>
        <h2>Video Youtube</h2>
        <!-- YouTube embed -->
        <div style="max-width:560px;">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/LZ1xMv-y_qo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <h3>Video</h3>
        <video controls poster="videos/poster.jpg" style="max-width:100%;height:auto;">
            <source src="videos/sample.mp4" type="video/mp4">
            <source src="videos/sample.webm" type="video/webm">
            Trình duyệt của bạn không hỗ trợ video.
        </video>
    </section>

    <section>
        <h2>Audio</h2>
        <audio controls>
            <source src="audio/intro.mp3" type="audio/mpeg">
            <source src="audio/intro.ogg" type="audio/ogg">
            Trình duyệt của bạn không hỗ trợ audio.
        </audio>
    </section>

    <section>
        <h2>SVG</h2>
        <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo thương hiệu">
            <circle cx="50" cy="50" r="40" fill="blue" />
             <text x="50%" y="55%" text-anchor="middle" fill="white" font-size="20" font-family="Arial">LOGO</text>
        </svg>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
