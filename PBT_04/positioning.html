<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Layout</title>
    <link rel="stylesheet" href="positioning.css">
</head>

<body>

        <div class="logo">LOGO</div>
        <nav class="nav">
            <a href="#">Home</a>

            </div>
            <div class="product-card">
