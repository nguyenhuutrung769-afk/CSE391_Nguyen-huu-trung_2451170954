<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>

<body>
    <div class="grid-container">
        <header class="header">HEADER</header>

        <section class="hero">
            <div class="hero-banner">HERO BANNER</div>
            <div class="featured-card">Sản phẩm nổi bật</div>
        </section>

        <aside class="sidebar">
            <h3>Bộ lọc</h3>
            <label><input type="checkbox"> Danh mục 1</label><br>
            <label><input type="checkbox"> Danh mục 2</label><br>
            <label><input type="checkbox"> Danh mục 3</label><br>
        </aside>

        <main class="main">
            <div class="product-card">Card 1</div>
            <div class="product-card">Card 2</div>
            <div class="product-card">Card 3</div>
            <div class="product-card">Card 4</div>
            <div class="product-card">Card 5</div>
            <div class="product-card">Card 6</div>
        </main>

        <aside class="ads">
            <img src="https://via.placeholder.com/200x600" alt="Quảng cáo">
        </aside>

        <footer class="footer">FOOTER</footer>
    </div>
</body>

</html>
